<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Emby Edge</title>
  <link rel="stylesheet" href="/assets/panel.css">
  <script defer src="/assets/lucide.min.js"></script>
  <script defer src="/assets/panel.js"></script>
</head>
<body>
  <header>
    <div class="brand"><i data-lucide="network"></i><span id="brand">Emby Edge</span></div>
    <div class="header-actions" id="header-actions" hidden>
      <span id="identity"></span>
      <button type="button" class="icon" id="refresh" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button>
      <button type="button" class="icon" id="logout" title="退出登录" aria-label="退出登录"><i data-lucide="log-out"></i></button>
    </div>
  </header>
  <main>
    <section id="auth" class="auth">
      <h1>账户</h1>
      <div class="tabs auth-tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-auth="login">登录</button>
        <button type="button" role="tab" aria-selected="false" data-auth="register">注册</button>
      </div>
      <form id="auth-form">
        <label>用户名<input name="username" autocomplete="username" minlength="2" maxlength="24" pattern="[A-Za-z0-9]{2,24}" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
        <label id="code-label" hidden>授权码<input name="code" autocomplete="off" maxlength="128"></label>
        <p id="auth-error" class="error" role="alert"></p>
        <button class="primary full" type="submit"><i data-lucide="log-in"></i><span id="auth-submit">登录</span></button>
      </form>
    </section>
    <section id="workspace" hidden>
      <div class="page-heading"><h1 id="heading">我的线路</h1><span id="summary" class="muted"></span></div>
      <aside id="announcement" class="announcement" hidden></aside>
      <nav class="tabs" id="navigation" aria-label="面板视图"></nav>
      <section id="routes-view" class="view">
        <div class="toolbar">
          <label class="search"><i data-lucide="search"></i><input id="route-search" type="search" placeholder="搜索线路、源站或用户" aria-label="搜索线路"></label>
          <button type="button" class="primary" id="new-route"><i data-lucide="plus"></i>新建线路</button>
        </div>
        <div class="table-scroll"><table><thead id="route-head"></thead><tbody id="route-body"></tbody></table></div>
        <p id="route-empty" class="empty" hidden>暂无线路</p>
      </section>
      <section id="nodes-view" class="view" hidden>
        <div class="toolbar"><h2>节点</h2><button type="button" class="primary" id="new-node"><i data-lucide="plus"></i>添加节点</button></div>
        <div class="table-scroll"><table><thead><tr><th>名称</th><th>通信地址</th><th>公网端口</th><th>状态</th><th>操作</th></tr></thead><tbody id="node-body"></tbody></table></div>
        <p id="node-empty" class="empty" hidden>暂无节点</p>
      </section>
      <section id="users-view" class="view" hidden>
        <div class="table-scroll"><table><thead><tr><th>用户名</th><th>有效期</th><th>线路数</th><th>额度</th><th>操作</th></tr></thead><tbody id="user-body"></tbody></table></div>
        <p id="user-empty" class="empty" hidden>暂无用户</p>
      </section>
      <section id="codes-view" class="view" hidden>
        <form id="code-form" class="toolbar">
          <label class="inline-label">初始线路额度<input name="route_limit" type="number" min="1" max="1000" value="3" required></label>
          <button type="submit" class="primary"><i data-lucide="ticket-plus"></i>签发授权码</button>
        </form>
        <div class="table-scroll"><table><thead><tr><th>授权码</th><th>额度</th><th>状态</th><th>绑定用户</th><th>操作</th></tr></thead><tbody id="code-body"></tbody></table></div>
        <p id="code-empty" class="empty" hidden>暂无授权码</p>
      </section>
      <section id="operations-view" class="view" hidden>
        <div class="table-scroll"><table><thead><tr><th>线路</th><th>操作</th><th>状态</th><th>阶段</th><th>详情</th></tr></thead><tbody id="operation-body"></tbody></table></div>
        <p id="operation-empty" class="empty" hidden>暂无任务</p>
      </section>
      <section id="settings-view" class="view" hidden>
        <form id="announcement-form" class="settings-form">
          <label>公告<textarea name="text" rows="6" maxlength="10000"></textarea></label>
          <button type="submit" class="primary"><i data-lucide="save"></i>发布公告</button>
        </form>
      </section>
    </section>
  </main>
  <dialog id="route-dialog">
    <form id="route-form">
      <div class="dialog-heading"><h2 id="route-title">新建线路</h2><button type="button" class="icon close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
      <label id="suffix-label">线路缩写<input name="subdomain" maxlength="32" pattern="[a-z0-9][a-z0-9-]*" required></label>
      <p id="route-preview" class="muted mono"></p>
      <label>节点<select name="node_id" required></select></label>
      <label>源站地址<input name="target" maxlength="2048" placeholder="https://emby.example.com:8096" required></label>
      <p class="error form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="close">取消</button><button type="submit" class="primary"><i data-lucide="check"></i>提交</button></div>
    </form>
  </dialog>
  <dialog id="node-dialog">
    <form id="node-form">
      <div class="dialog-heading"><h2>添加节点</h2><button type="button" class="icon close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
      <label>节点名称<input name="name" maxlength="80" required></label>
      <label>公网 IP 或域名<input name="host" maxlength="253" required></label>
      <div class="form-grid">
        <label>通信公网端口<input name="port" type="number" min="1" max="65535" required></label>
        <label>线路公网端口<input name="public_port" type="number" min="1" max="65535" required></label>
      </div>
      <label>共享密钥<input name="key" type="password" autocomplete="off" maxlength="256" required></label>
      <p class="error form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="close">取消</button><button type="submit" class="primary"><i data-lucide="check"></i>添加</button></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog">
    <div class="dialog-heading"><h2 id="confirm-title"></h2><button type="button" class="icon close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div>
    <p id="confirm-text"></p>
    <div class="dialog-actions"><button type="button" class="close">取消</button><button type="button" class="danger" id="confirm-yes"><i data-lucide="trash-2"></i>确认删除</button></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
